worker_processes  auto;

error_log  /dev/stdout warn;
    # docker saves it to file anyways
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    #tcp_nopush     on;
    # For debugging, activate this format and use it for the access_log
    # Detailed access log for troubleshooting.
    log_format detailed_debug '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              'rt=$request_time ua="$http_user_agent" '
                              'upstream_addr="$upstream_addr" upstream_status="$upstream_status" '
                              'upstream_response_time="$upstream_response_time" '
                              'request_length=$request_length bytes_sent=$bytes_sent '
                              'host="$host" forwarded_for="$http_x_forwarded_for" '
                              'scheme=$scheme ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher '
                              'conn_incoming="$http_connection" upgr_incoming="$http_upgrade" '
                              'proto="$server_protocol" '
                              'conn_outgoing="$sent_http_connection" upgr_outgoing="$sent_http_upgrade"';

    access_log /dev/stdout detailed_debug;

    keepalive_timeout  65;

    # https://serverfault.com/questions/240476/how-to-force-nginx-to-resolve-dns-of-a-dynamic-hostname-everytime-when-doing-p
    # This way we make sure we get the current DNS records for the upstream servers
    # we simply use variables in the proxy_pass to ensure this is used
    resolver 127.0.0.11 valid=10s;
        # TODO: this is for docker, this will NOT work for Podman (uses another dns server address)

    map $http_upgrade $connection_upgrade {
        default "";
        websocket upgrade;
    }

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    #gzip  on;
    include /etc/nginx/conf.d/*;
    # nginx.conf is mounted as a template (→ conf.d/server.conf via envsubst by the nginx image).
    # It contains all locations and upstream servers, and includes ssl-config-snippet.conf
    # from inside the server block for the HTTP/HTTPS listen directives.
}
